version: "3.9"

services:
  chatbot-db:
    image: postgres:16-alpine
    container_name: ai-nexus-chatbot-db
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_password
      POSTGRES_DB: ai_nexus_chatbot
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d ai_nexus_chatbot"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway-db:
    image: postgres:16-alpine
    container_name: ai-nexus-gateway-db
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_password
      POSTGRES_DB: ai_nexus_gateway
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d ai_nexus_gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-nexus-redis
    ports:
      - "6379:6379"

  ai-nexus-gateway:
    build:
      context: ./ai-nexus-gateway
      dockerfile: Dockerfile
    container_name: ai-nexus-gateway
    depends_on:
      gateway-db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://gateway:gateway_password@gateway-db:5432/ai_nexus_gateway"
      REDIS_URL: "redis://redis:6379"
      ALLOWED_ORIGINS: "http://localhost:3000"
      NODE_WS_PATH: "/ws/node"
      LOG_LEVEL: "info"

  ai-nexus-chatbot:
    build:
      context: ./ai-nexus-chatbot
      dockerfile: Dockerfile
    container_name: ai-nexus-chatbot
    depends_on:
      chatbot-db:
        condition: service_healthy
      ai-nexus-gateway:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://chatbot:chatbot_password@chatbot-db:5432/ai_nexus_chatbot"
      LLM_PROVIDER: "gemini"
      GATEWAY_INTERNAL_URL: "http://ai-nexus-gateway:4000"
      VITE_GATEWAY_HTTP_URL: "http://localhost:4000"
      VITE_GATEWAY_WS_URL: "ws://localhost:4000/ws/node"
